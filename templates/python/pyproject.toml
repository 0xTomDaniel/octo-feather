[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = ["basedpyright", "import-linter", "pytest", "pytest-xdist", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
# The octo-feather kit's trend hook (tests/gate/conftest.py), copied byte for byte; the kit owns it and
# does not lint it, so it is outside this repo's lint, format and type checks.
extend-exclude = ["tests/conftest.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # no per-file copyright headers
  "D",       # docstrings are optional; names carry intent
  "S101",    # pytest asserts
  "S603",    # E2E tests run the app as a subprocess
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "PLR2004"]  # tests are not a package; exit codes are literal

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["tests/conftest.py"]  # the kit's trend hook, copied byte for byte (see [tool.ruff])

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core never imports the CLI"
type = "layers"
layers = ["app.cli", "app.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every item's duration, failures with their output at the end, junit xml for the trend line (tests/conftest.py).
addopts = "--strict-markers --durations=0 --durations-min=0 --junitxml=.pytest_cache/junit.xml"
