# Native tool pins: mise owns these (from mise.lock: `just setup` through octo-feather-mise-install, the octo-feather
# kit's; CI: jdx/mise-action reading the same files), mise's own version: mise-version. uv owns Python
# (.python-version) and Python packages (uv.lock). [tools] only: no [env], [tasks] or hooks, so mise reads it without
# `mise trust`. Change a pin here, then `mise lock`.
[tools]
uv = "0.13.1"
just = "1.21.0"
shellcheck = "0.9.0"
# scc (scripts/check-languages' classifier) is not in mise's short registry: its aqua package.
"aqua:boyter/scc" = "4.1.0"
