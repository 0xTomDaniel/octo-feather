name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  # Whether a push runs the check job: the octo-feather kit's issue-lifecycle spec #lanes-one-head. Not paths-ignore: on a
  # pull request it reads the whole PR's diff, and a required check it skips stays pending. dorny/paths-filter with no
  # token diffs the pushed range, github.event.before to the head, in git; a diff that fails leaves the check job running.
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - if: github.event.action == 'synchronize'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (no moving tag)
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: diff
        if: github.event.action == 'synchronize'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 (no moving tag)
        with:
          token: ''
          base: ${{ github.event.before }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/specs/*.status.json'
  check:
    needs: scope
    if: needs.scope.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (no moving tag)
      # Native tools from mise.toml and mise.lock, the pins `just setup` installs (octo-feather-mise-install, the
      # octo-feather kit's): mise at mise-version (the action verifies its signed checksums), then it installs them (a
      # runner has no global mise tools, so the action's install takes the same ones). Cached: mise's downloads, which
      # it verifies again on use, never installed tool trees; the key is mise.lock.
      - id: pins
        run: echo "mise=$(tr -d '[:space:]' < mise-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (no moving tag)
        with:
          path: ~/.local/share/mise/downloads
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4 (no moving tag)
        env:
          MISE_ALWAYS_KEEP_DOWNLOAD: "1"
        with:
          version: ${{ steps.pins.outputs.mise }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: just check
