# The kit's gate-time budget, kept by the factory like any repo policy. What reads it, its keys and what each
# means: octo-feather-lane --help (report). budget_seconds: the full-gate target, quality spec
# #acceptance-gate-time-targets.
budget_seconds = 300
growth_share = 0.25
trend_runs = 5
# test_cpu_seconds: the per-test CPU budget (quality spec #test-kinds, #acceptance-test-cpu-budget): a non-e2e item over
# it fails the gate when changed (octo-feather-gate changed), else is reported only (#1182; tests/gate/conftest.py);
# provisional, from the CPU stability measurement in PR #605's Validation section.
test_cpu_seconds = 10
# heavy_items, heavy_slots, eval_slots: the box's run slots (#668), what each means: octo-feather-slot --help.
heavy_items = 30
# fast_workers: the fast tier's worker count (what it means: quality #recipes-static-first, #1210;
# tests/gate/heavy_slot.py); just fast runs on it. Picked from measurement on the factory's 8-vCPU box, fast runs
# alone and beside a full gate: evidence/2026-11-21-fast-slot-free.md.
fast_workers = 3
# fast_runs: how many fast-tier runs may run at once on the box (quality #recipes-static-first, #1213;
# tests/gate/heavy_slot.py); one over it waits its turn. From the guard measurement: evidence/2026-11-21-gh1213-fast-priority.md.
fast_runs = 2
heavy_slots = 1
eval_slots = 1
# slot_grace_seconds: the slot queue's grace (#976), what it means: octo-feather-slot --help.
slot_grace_seconds = 60
# slot_bound_seconds: the slot queue's bound for a holder's first run (#977), what it means: octo-feather-slot --help.
slot_bound_seconds = 1200
# usage_reserve: the share of the Claude account's weekly limit the lane start keeps back; lane_limit: the box's open
# lanes at most. What reads them and what each means: octo-feather-lane --help (start); issue-lifecycle #lanes-start.
usage_reserve = 0.1
lane_limit = 7
