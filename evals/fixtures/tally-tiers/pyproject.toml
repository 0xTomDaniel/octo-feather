[project]
name = "tally"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tally = "tally.cli:main"

[dependency-groups]
dev = ["basedpyright", "import-linter", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # no per-file copyright headers
  "D",       # docstrings are optional; names carry intent
  "S101",    # pytest asserts
  "S603",    # E2E tests run the app as a subprocess
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "PLR2004"]  # tests are not a package; exit codes are literal

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.importlinter]
root_package = "tally"

[[tool.importlinter.contracts]]
name = "core never imports the CLI"
type = "layers"
layers = ["tally.cli", "tally.count"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: an end-to-end test, run by just check only (tests/e2e/conftest.py marks it)"]
