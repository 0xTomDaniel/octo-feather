<h1>Usage</h1>
<p data-anchor="usage-hello"><code>app hello NAME</code> greets NAME. <code>--shout</code> upper-cases the greeting. <code>--times N</code> repeats it N times, one per line; N below 1 exits 2 with an error.</p>
