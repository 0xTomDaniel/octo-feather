[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
