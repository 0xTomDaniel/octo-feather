# The kit's test runner (#224): `just check` runs every gate recipe and every tests/*.sh as one pytest
# item each, by subprocess (tests/gate/, docs/adr/0002); and the kit's Python lint, format and type tools
# (#244, below). Not a package; no kit code imports from here but a kit script's runtime dep below.
[project]
name = "octo-feather-kit-tests"
version = "0"
requires-python = ">=3.10"
# octo-feather-contract validates qc.toml with jsonschema, re-running itself here (uv run --locked --offline);
# the verify-octo-feather template-tiers drive reads a created repo's CI workflow step with PyYAML, the same way;
# merge_ask.py reads a correction lane's `## Replay` table with markdown-it-py (CommonMark + GFM tables), the same way.
dependencies = [
    "jsonschema==4.26.0",
    "markdown-it-py==4.0.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "coverage==7.17.1 ; python_full_version >= '3.11'",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.1",
    "tomlkit==0.15.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/gate"]
# How a test imports a kit module (scripts/*.py: correction_lanes.py, its docstring): by name, scripts/ on
# sys.path, as the commands beside them find it; never by path. Only the names its __all__ lists (#1081).
pythonpath = ["scripts"]
# Every item's duration, failures with their captured output, junit xml for the trend line (tests/gate/conftest.py).
addopts = "--strict-markers --durations=0 --junitxml=.pytest_cache/junit.xml"

# Kit Python lint, format and types: templates/python's config as written there (#244), run by
# `octo-feather-lint` over ruff's own file list (check-lint, check-format, check-types).
[tool.ruff]
line-length = 100
# Extensionless Python scripts, each by exact path: ruff (and basedpyright) skip a file without a .py
# suffix unless it is named. scripts/check-languages fails, naming the file, when scc finds tracked
# Python ruff's list misses.
extend-include = [
  ".agents/skills/github-pr/scripts/gh",
  ".agents/skills/verify-octo-feather/scripts/verify-octo-feather",
  "scripts/check-behavior-smoke",
  "scripts/check-dashes",
  "scripts/check-refs",
  "scripts/check-decision-log",
  "scripts/check-evals",
  "scripts/check-gate-free",
  "scripts/check-languages",
  "scripts/check-owner-field",
  "scripts/check-roles",
  "scripts/check-skills",
  "scripts/check-templates",
  "scripts/check-vendored",
  "scripts/octo-feather-accepted",
  "scripts/octo-feather-contract",
  "scripts/octo-feather-evidence",
  "scripts/octo-feather-gate",
  "scripts/octo-feather-handoff",
  "scripts/octo-feather-lane",
  "scripts/octo-feather-lint",
  "scripts/octo-feather-mise-install",
  "scripts/octo-feather-queued",
  "scripts/octo-feather-parent-gone",
  "scripts/octo-feather-qa",
  "scripts/octo-feather-qc",
  "scripts/octo-feather-qc-ghsnap",
  "scripts/octo-feather-qc-sandbox",
  "scripts/octo-feather-reflect",
  "scripts/octo-feather-shape",
  "scripts/octo-feather-slot",
  "scripts/octo-feather-spec-status",
  "scripts/pi-role",
  "scripts/review-host",
  "tests/fixtures/classify-stub/pi",
  "tests/fixtures/install-check/pi",
  "tests/fixtures/lane-report/gh",
  "tests/fixtures/reflection-director",
  "tests/fixtures/start-nohup",
  "tests/fixtures/tracker-gh/gh",
  "tests/spend-out",
]
# Out of the kit's Python file set, each once with its reason (the template's own extend-exclude names its
# copy of tests/gate/conftest.py, which the kit does lint):
extend-exclude = [
  "evals/",      # eval fixtures and judgment sources: deliberately flawed data the cases grade
  "templates/",  # each template runs its own gate in its own repo
  "evidence/",   # frozen records of past runs
  # vendored skills (Skillfile github entries): upstream code, changed only through .skillfile/patches
  ".agents/skills/{tdd,implement,implement-spec,to-tickets,grill-with-docs,grilling,domain-modeling,code-review,writing-for-agents,correct,improve-codebase-architecture,codebase-design,principle-prove-it-works,blast-radius,sharpen,principle-encode-lessons-in-structure,interrogate,linear-cli}/",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # no per-file copyright headers
  "D",       # docstrings are optional; names carry intent
  "S101",    # pytest asserts
  "S603",    # E2E tests run the app as a subprocess
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "PLR2004"]  # tests are not a package; exit codes are literal

[tool.basedpyright]
typeCheckingMode = "strict"
# tests/gate/kit/conftest.py imports the gate runner (test_gate), as pytest's rootdir import puts tests/gate on sys.path;
# scripts: the kit modules tests import ([tool.pytest.ini_options] pythonpath).
extraPaths = ["tests/gate", "scripts"]

