# The parity lever's case for tests/qa-isolation.sh: its six sandboxed cases cut to four in one
# octo-feather-qa run, leak's commands in tamper's case, nocred's fact in overflow's, sync's case
# in the iso run (#1206; earlier #998; tests/parity/lever.py --help).
old = "tests/qa-isolation.sh"
old_at = "a00d2e09"
# Every file under tests/ the old test sources, runs or reads at old_at (lever.py --help).
needs = ["tests/gate/kit/qa_sections.py", "tests/gate/kit/testkit"]
# The same script, as its gate item: its id kept.
new = "tests/gate/test_gate.py::test_script[tests/qa-isolation.sh]"

# How the clean old run shows it ran each file a defect patches (lever.py --help): coverage:
# scripts/eval_grading.py, the module the Python kit script octo-feather-qa imports, run by the kit
# venv's python: coverage.py measures it; exec: the qc sandbox, run as a program, its shims inside it.
[ran]
"scripts/eval_grading.py" = "coverage"
"scripts/octo-feather-qc-sandbox" = "exec scripts/octo-feather-qc-sandbox"
