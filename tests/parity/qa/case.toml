# one run, its kit-evals coverage copies from four check-evals runs into two (#1204; earlier #998;
# tests/parity/lever.py --help).
old = "tests/qa.sh"
old_at = "a00d2e09"
# Every file under tests/ the old test sources, runs or reads at old_at (lever.py --help).
needs = ["tests/gate/kit/qa_sections.py", "tests/gate/kit/testkit"]
# The same script, as its gate item: its id kept.
new = "tests/gate/test_gate.py::test_script[tests/qa.sh]"

# How the clean old run shows it ran each file a defect patches (lever.py --help): coverage:
# scripts/eval_grading.py, the module the Python kit script octo-feather-qa imports, octo-feather-qa
# itself and check-evals, each run by the kit venv's python: coverage.py measures it.
[ran]
"scripts/eval_grading.py" = "coverage"
"scripts/octo-feather-qa" = "coverage"
"scripts/check-evals" = "coverage"
