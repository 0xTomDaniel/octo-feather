# The kit gate in CI: the same `just check` agents and git hooks run
# (docs/specs/quality.spec.html#recipe-check). Install only what the gate needs;
# ubuntu-latest already ships bash, git, python3 and shellcheck.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-behavior-smoke compares the PR with its base (origin/$GITHUB_BASE_REF)
      - uses: extractions/setup-just@v2
      # tests/qc.sh runs the qc judge's sandbox (`unshare -rm`); Ubuntu 24.04 restricts unprivileged user namespaces.
      - run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # check-vendored downloads skillfile v1.9.2 (sha256-pinned in scripts/check-vendored) from its GitHub
      # release and the pinned upstream skills through the GitHub API; the token avoids the anonymous rate limit.
      - run: just check
        env:
          GH_TOKEN: ${{ github.token }}
