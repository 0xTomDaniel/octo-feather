# The kit gate in CI: the same `just check` agents and git hooks run
# (docs/specs/quality.spec.html#recipe-check). Install only what the gate needs; ubuntu-latest ships bash, git and
# python3. Native tools (node, pnpm, uv, just, shellcheck, scc) come from mise at the kit's mise.toml and mise.lock,
# the pins the box installs (owner ruling, issue #261).
name: check
on:
  # When: docs/specs/templates.spec.html#acceptance-same-gate.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  # Whether a push runs the check job: docs/specs/issue-lifecycle.spec.html#lanes-one-head. Not paths-ignore: on a pull
  # request it reads the whole PR's diff, and a required check it skips stays pending. dorny/paths-filter with no token
  # diffs the pushed range, github.event.before to the head, in git; a diff that fails leaves the check job running.
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - if: github.event.action == 'synchronize'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: diff
        if: github.event.action == 'synchronize'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 (no moving tag)
        with:
          token: ''
          base: ${{ github.event.before }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/specs/*.status.json'
  check:
    needs: scope
    if: needs.scope.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-behavior-smoke compares the PR with its base (origin/$GITHUB_BASE_REF)
      # mise at mise-version (the action verifies its signed checksums), then `mise install --locked` (the action adds
      # --locked when mise.lock exists): every tool from mise.lock's URLs, sha256-checked. Cached: mise's downloads, which
      # it verifies again on use, never installed tool trees (owner ruling, issue #261); the key is mise.lock.
      - id: pins
        run: echo "mise=$(tr -d '[:space:]' < mise-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (no moving tag)
        with:
          path: ~/.local/share/mise/downloads
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4 (no moving tag)
        env:
          MISE_ALWAYS_KEEP_DOWNLOAD: "1"
        with:
          version: ${{ steps.pins.outputs.mise }}
          cache: false
      # tests/qc.sh runs the qc judge's sandbox (`unshare -rm`); Ubuntu 24.04 restricts unprivileged user namespaces.
      - run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # The spec-chat pin is a private repo: its read-only deploy key, used for that repo's URL only.
      - env:
          SPEC_CHAT_DEPLOY_KEY: ${{ secrets.SPEC_CHAT_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$SPEC_CHAT_DEPLOY_KEY" > ~/.ssh/id_spec_chat)
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf 'Host github-spec-chat\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_spec_chat\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."git@github-spec-chat:0xTomDaniel/spec-chat".insteadOf "https://github.com/0xTomDaniel/spec-chat"
      # The gate calls no network service (docs/specs/quality.spec.html#boundary-gate), so the one
      # network step runs first, on its own: the pinned skillfile binary (sha256-checked) and each
      # Skillfile pin commit (fetch-only entries included) from github.com, every call time-bounded. The gate then reads them offline.
      - run: just vendored-fetch
      # Pi at the pin in pi-version (docs/adr/0023 Consequences): the second network step, on mise's node (above Pi's
      # engines floor, >= 22.19). npm, not Pi's installer, because only npm takes a version; its transitive
      # dependencies are not pinned (Pi's README).
      # Into ~/.local (bin on the justfile's PATH), where the box has Pi, never mise's node prefix: a global there joins
      # mise's tool dirs and its shims (#261: on eaeaf95a it shadowed the tests' stub pi).
      - run: npm install -g --ignore-scripts --prefix "$HOME/.local" "@earendil-works/pi-coding-agent@$(tr -d '[:space:]' < pi-version)"
      # The gate's Python, the kit's .python-version release through uv (python-build-standalone; owner ruling #422,
      # #261), as the box installs it (why --no-bin: the justfile's check-tests message). The eval fixtures and
      # templates/python below keep their own resolution: uv reads .python-version only inside each project. Network.
      - run: uv python install --no-bin
      # The kit's test deps (pytest, pytest-xdist: uv.lock), each eval fixture's and templates/python's locked deps
      # (tests/template-languages.sh) into uv's cache, with
      # mise's uv: the third network step. The gate runs pytest with --offline, and tests/qa.sh syncs python-app copies
      # inside it with UV_OFFLINE=1, from this cache only.
      - run: uv sync --locked --quiet && for l in evals/fixtures/*/uv.lock templates/python/uv.lock; do UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/fixture-venv" uv sync --locked --quiet --project "${l%/uv.lock}"; done
      # The TypeScript template's locked packages into pnpm's store, with mise's pnpm: the fourth network step. The gate's
      # tests (tests/contract.sh, tests/evidence.sh) install template copies with pnpm install --offline
      # --frozen-lockfile, from this store only.
      - run: pnpm fetch --frozen-lockfile --dir templates/typescript
      # The kit's TypeScript tools (tsc, eslint: package.json, pnpm-lock.yaml) into the same store and
      # node_modules: check-ts installs from that store with --offline.
      - run: pnpm install --frozen-lockfile
      # The runner's 4 CPUs are the gate's alone: one pytest worker each (local default: the justfile's check-tests).
      - run: just check
        env:
          GATE_WORKERS: 4
