# The kit gate in CI: the same `just check` agents and git hooks run
# (docs/specs/quality.spec.html#recipe-check). Install only what the gate needs;
# ubuntu-latest already ships bash, git, python3 and shellcheck.
name: check
on:
  # When: docs/specs/templates.spec.html#acceptance-same-gate.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-behavior-smoke compares the PR with its base (origin/$GITHUB_BASE_REF)
      # just at the pin in just-version: the gate reads just's own answers (check-gate-free), so box and CI run one just.
      - id: pins
        run: echo "just=$(tr -d '[:space:]' < just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@v2
        with:
          just-version: ${{ steps.pins.outputs.just }}
      # tests/qc.sh runs the qc judge's sandbox (`unshare -rm`); Ubuntu 24.04 restricts unprivileged user namespaces.
      - run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # The spec-chat pin is a private repo: its read-only deploy key, used for that repo's URL only.
      - env:
          SPEC_CHAT_DEPLOY_KEY: ${{ secrets.SPEC_CHAT_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$SPEC_CHAT_DEPLOY_KEY" > ~/.ssh/id_spec_chat)
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf 'Host github-spec-chat\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_spec_chat\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."git@github-spec-chat:0xTomDaniel/spec-chat".insteadOf "https://github.com/0xTomDaniel/spec-chat"
      # The gate calls no network service (docs/specs/quality.spec.html#boundary-gate), so the one
      # network step runs first, on its own: the pinned skillfile binary (sha256-checked) and each
      # Skillfile pin commit (fetch-only entries included) from github.com, every call time-bounded. The gate then reads them offline.
      - run: just vendored-fetch
      # Pi at the pin in pi-version (docs/adr/0023 Consequences): the second network step. Node 22.x, whose latest
      # is above Pi's engines floor (>= 22.19). npm, not Pi's installer, because only npm takes a version; its
      # transitive dependencies are not pinned (Pi's README).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@$(tr -d '[:space:]' < pi-version)"
      # uv at an exact version, sha256-checked (the release's own .sha256), then the kit's test deps (pytest, pytest-xdist:
      # uv.lock) and each eval fixture's locked deps into uv's cache: the third network step. The gate runs pytest with
      # --offline, and tests/qa.sh syncs python-app copies inside it with UV_OFFLINE=1, from this cache only.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (no moving v10 tag)
        with:
          version: "0.13.1"
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220 # uv-x86_64-unknown-linux-gnu.tar.gz
          enable-cache: false
      - run: uv sync --locked --quiet && for l in evals/fixtures/*/uv.lock; do UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/fixture-venv" uv sync --locked --quiet --project "${l%/uv.lock}"; done
      # The kit's TypeScript tools (tsc, eslint: package.json, pnpm-lock.yaml) into pnpm's store and node_modules: the fourth
      # network step. check-ts installs from that store with --offline. pnpm at package.json's packageManager pin, by Node's corepack.
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # The runner's 4 CPUs are the gate's alone: one pytest worker each (local default: the justfile's check-tests).
      - run: just check
        env:
          GATE_WORKERS: 4
